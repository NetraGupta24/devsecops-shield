# Ansible settings, used automatically when ansible-playbook runs from the ansible/ folder.
[defaults]
inventory = inventory/aws_ec2.yml
roles_path = roles
remote_user = ec2-user
# Instances are replaced all the time (Auto Scaling, Blue-Green), so their SSH
# host keys keep changing. Checking them would make every new instance fail.
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml
timeout = 30

[inventory]
# aws_ec2 = dynamic inventory; host_list/ini = plain lists (handy for testing).
enable_plugins = amazon.aws.aws_ec2, host_list, ini

[ssh_connection]
# Re-use one SSH connection for many tasks, and send modules more efficiently.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
pipelining = True
retries = 3
